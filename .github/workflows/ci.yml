name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: make pipeline
      - run: .venv/bin/python -m pytest -q
      - name: Serve and probe the dashboard
        run: |
          make dashboard &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health >/dev/null && break; sleep 1; done
          curl -sf localhost:8000/api/health
          curl -sf 'localhost:8000/api/cohort/summary' | grep -q '"n_samples":1968'
          curl -sf localhost:8000/ | grep -q '<div id="root">'
          kill %1
